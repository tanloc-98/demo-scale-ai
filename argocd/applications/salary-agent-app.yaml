apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: salary-agent
  namespace: argocd
spec:
  project: hr-ai
  source:
    repoURL: git@github.com:tanloc-98/demo-scale-ai.git
    targetRevision: HEAD
    path: k8s/agents
    directory:
      include: "salary-*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: hr-ai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
