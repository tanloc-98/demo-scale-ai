apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hr-ai-all
  namespace: argocd
spec:
  project: hr-ai
  source:
    repoURL: git@github.com:tanloc-98/demo-scale-ai.git
    targetRevision: HEAD
    path: k8s
    directory:
      recurse: true
      exclude: "monitoring/**"    # Helm-managed, not raw K8s manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: hr-ai
  # Ignore spec.replicas so HPA and demo scaling aren't reverted by ArgoCD
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
