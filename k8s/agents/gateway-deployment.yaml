apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-gateway
  namespace: hr-ai
spec:
  replicas: 3
  selector:
    matchLabels:
      app: agent-gateway
  template:
    metadata:
      labels:
        app: agent-gateway
    spec:
      containers:
      - name: backend
        image: hr-ai-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: MOCK_LLM
          value: "false"
        - name: MLX_LM_BASE_URL
          value: "http://host.docker.internal:8080/v1"
        - name: REDIS_URL
          value: "redis://redis-service:6379/0"
        - name: DATABASE_URL
          value: "sqlite+aiosqlite:///./hrdb.sqlite3"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: agent-gateway-service
  namespace: hr-ai
spec:
  selector:
    app: agent-gateway
  ports:
  - port: 80
    targetPort: 8000
