apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: hr-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: hr-ai-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: hr-ai
spec:
  selector:
    app: frontend
  type: LoadBalancer
  ports:
  - port: 3000
    targetPort: 3000
