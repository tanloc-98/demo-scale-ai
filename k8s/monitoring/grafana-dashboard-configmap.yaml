apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-hr-ai
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  hr-ai-overview.json: |
    {
      "title": "HR AI Overview",
      "uid": "hr-ai-overview",
      "tags": ["hr-ai", "agents"],
      "timezone": "browser",
      "schemaVersion": 38,
      "refresh": "15s",
      "panels": [
        {
          "id": 1, "gridPos": {"h": 4, "w": 4, "x": 0, "y": 0},
          "type": "stat", "title": "LLM Requests/min",
          "targets": [{"expr": "rate(hr_ai_llm_calls_total[1m])*60", "legendFormat": "req/min"}],
          "options": {"colorMode": "background", "graphMode": "area", "reduceOptions": {"calcs": ["lastNotNull"]}}
        },
        {
          "id": 2, "gridPos": {"h": 4, "w": 4, "x": 4, "y": 0},
          "type": "stat", "title": "Avg LLM Latency (ms)",
          "targets": [{"expr": "avg(hr_ai_llm_latency_ms)", "legendFormat": "ms"}],
          "options": {"colorMode": "background", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}}
        },
        {
          "id": 3, "gridPos": {"h": 4, "w": 4, "x": 8, "y": 0},
          "type": "stat", "title": "Queue Depth",
          "targets": [{"expr": "hr_ai_queue_depth", "legendFormat": "jobs"}],
          "fieldConfig": {"defaults": {"thresholds": {"steps": [{"color": "green", "value": 0}, {"color": "yellow", "value": 50}, {"color": "red", "value": 200}]}}}
        },
        {
          "id": 4, "gridPos": {"h": 4, "w": 4, "x": 12, "y": 0},
          "type": "stat", "title": "Error Rate %",
          "targets": [{"expr": "rate(hr_ai_errors_total[5m]) / rate(hr_ai_requests_total[5m]) * 100", "legendFormat": "%"}],
          "fieldConfig": {"defaults": {"thresholds": {"steps": [{"color": "green", "value": 0}, {"color": "yellow", "value": 1}, {"color": "red", "value": 5}]}}}
        },
        {
          "id": 5, "gridPos": {"h": 4, "w": 4, "x": 16, "y": 0},
          "type": "stat", "title": "Active Pods",
          "targets": [{"expr": "count(kube_pod_info{namespace=\"hr-ai\"})", "legendFormat": "pods"}],
          "options": {"colorMode": "background"}
        },
        {
          "id": 6, "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "type": "timeseries", "title": "LLM Latency P50 / P95 (ms)",
          "targets": [
            {"expr": "histogram_quantile(0.50, rate(hr_ai_llm_latency_ms_bucket[2m]))", "legendFormat": "P50"},
            {"expr": "histogram_quantile(0.95, rate(hr_ai_llm_latency_ms_bucket[2m]))", "legendFormat": "P95"}
          ],
          "fieldConfig": {"defaults": {"unit": "ms", "color": {"mode": "palette-classic"}}}
        },
        {
          "id": 7, "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "type": "timeseries", "title": "Queue Depth (live)",
          "targets": [{"expr": "hr_ai_queue_depth", "legendFormat": "queued jobs"}],
          "fieldConfig": {"defaults": {"unit": "short", "color": {"fixedColor": "orange", "mode": "fixed"}}}
        },
        {
          "id": 8, "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "type": "timeseries", "title": "Requests / s (Salary vs Timesheet)",
          "targets": [
            {"expr": "rate(hr_ai_salary_requests_total[1m])", "legendFormat": "Salary"},
            {"expr": "rate(hr_ai_timesheet_requests_total[1m])", "legendFormat": "Timesheet"}
          ]
        },
        {
          "id": 9, "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "type": "timeseries", "title": "Token Usage / hr",
          "targets": [
            {"expr": "increase(hr_ai_prompt_tokens_total[1h])", "legendFormat": "Prompt tokens"},
            {"expr": "increase(hr_ai_completion_tokens_total[1h])", "legendFormat": "Completion tokens"}
          ]
        },
        {
          "id": 10, "gridPos": {"h": 8, "w": 24, "x": 0, "y": 20},
          "type": "logs", "title": "Agent Logs (Loki)",
          "targets": [{"expr": "{namespace=\"hr-ai\"} |= \"agent_call\"", "refId": "A"}],
          "datasource": {"type": "loki", "uid": "loki"}
        }
      ]
    }
