# MLX-LM runs directly on Mac M2 host (requires Apple Metal/Neural Engine).
# K8s pods access it via host.docker.internal:8080.
# This ExternalName Service routes in-cluster traffic to the host process.
---
apiVersion: v1
kind: Service
metadata:
  name: mlx-lm-service
  namespace: hr-ai
spec:
  type: ExternalName
  externalName: host.docker.internal
  ports:
  - name: http
    port: 8080
    targetPort: 8080
