apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: mlx-lm-worker-scaler
  namespace: hr-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mlx-lm
  # Single-node demo: max 1 replica (MLX-LM không thể chạy song song trên 1 Mac)
  # Khi multi-node: tăng maxReplicaCount lên số node Mac available
  minReplicaCount: 1
  maxReplicaCount: 1
  pollingInterval: 15       # kiểm tra queue depth mỗi 15s
  cooldownPeriod: 60        # chờ 60s trước khi scale down
  triggers:
    - type: redis
      metadata:
        address: redis-service.hr-ai.svc.cluster.local:6379
        listName: llm-request-queue
        listLength: "5"     # scale khi queue > 5 jobs đang chờ
        activationListLength: "1"
---
# Redis Exporter — expose queue depth metric cho Prometheus/Grafana
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: hr-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      labels:
        app: redis-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
    spec:
      containers:
      - name: redis-exporter
        image: oliver006/redis_exporter:latest
        env:
        - name: REDIS_ADDR
          value: "redis://redis-service:6379"
        ports:
        - containerPort: 9121
          name: metrics
        resources:
          requests:
            cpu: "20m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter-service
  namespace: hr-ai
  labels:
    app: redis-exporter
spec:
  selector:
    app: redis-exporter
  ports:
  - port: 9121
    targetPort: 9121
    name: metrics
