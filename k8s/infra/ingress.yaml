apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hr-ai-ingress
  namespace: hr-ai
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: hr-ai.local
    http:
      paths:
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: agent-gateway-service
            port:
              number: 80
