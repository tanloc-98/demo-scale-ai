apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: hr-ai
data:
  01_schema.sql: |
    -- HR AI Agents — PostgreSQL Schema

    CREATE TABLE IF NOT EXISTS employees (
        employee_id     VARCHAR(20) PRIMARY KEY,
        full_name       VARCHAR(100),
        department      VARCHAR(50),
        base_salary     NUMERIC(15, 2) NOT NULL,
        join_date       DATE,
        created_at      TIMESTAMPTZ DEFAULT NOW()
    );

    CREATE TABLE IF NOT EXISTS salary_results (
        id              SERIAL PRIMARY KEY,
        job_id          VARCHAR(20) UNIQUE NOT NULL,
        employee_id     VARCHAR(20) NOT NULL,
        period          VARCHAR(7)  NOT NULL,
        gross_salary    NUMERIC(15, 2),
        net_salary      NUMERIC(15, 2),
        deductions_json JSONB,
        result_json     JSONB,
        created_at      TIMESTAMPTZ DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_salary_emp_period ON salary_results (employee_id, period);

    CREATE TABLE IF NOT EXISTS timesheet_results (
        id              SERIAL PRIMARY KEY,
        job_id          VARCHAR(20) UNIQUE NOT NULL,
        employee_id     VARCHAR(20) NOT NULL,
        period          VARCHAR(7)  NOT NULL,
        days_present    INT,
        days_absent     INT,
        total_hours     NUMERIC(6, 2),
        overtime_hours  NUMERIC(6, 2),
        anomalies_json  JSONB,
        approved        BOOLEAN DEFAULT FALSE,
        created_at      TIMESTAMPTZ DEFAULT NOW()
    );

    CREATE TABLE IF NOT EXISTS audit_log (
        id          BIGSERIAL PRIMARY KEY,
        timestamp   TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        user_id     VARCHAR(50),
        action      VARCHAR(50) NOT NULL,   -- e.g. "salary.calculate"
        resource    VARCHAR(50),
        employee_id VARCHAR(20),
        ip_address  VARCHAR(45),
        result      VARCHAR(20) NOT NULL    -- "success" | "denied" | "error"
    );

    CREATE INDEX IF NOT EXISTS idx_audit_ts         ON audit_log (timestamp);
    CREATE INDEX IF NOT EXISTS idx_audit_employee   ON audit_log (employee_id);
    CREATE INDEX IF NOT EXISTS idx_audit_action     ON audit_log (action);

    CREATE TABLE IF NOT EXISTS jobs (
        job_id          VARCHAR(20) PRIMARY KEY,
        employee_id     VARCHAR(20) NOT NULL,
        job_type        VARCHAR(20) NOT NULL,   -- "salary" | "timesheet"
        status          VARCHAR(20) NOT NULL,   -- "queued" | "processing" | "completed" | "failed"
        payload_json    JSONB,
        result_json     JSONB,
        error           TEXT,
        created_at      TIMESTAMPTZ DEFAULT NOW(),
        updated_at      TIMESTAMPTZ DEFAULT NOW(),
        completed_at    TIMESTAMPTZ
    );

    CREATE INDEX IF NOT EXISTS idx_jobs_status  ON jobs (status);
    CREATE INDEX IF NOT EXISTS idx_jobs_emp     ON jobs (employee_id);
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: hr-ai
type: Opaque
stringData:
  POSTGRES_DB:       hr_ai_db
  POSTGRES_USER:     hr_ai_user
  POSTGRES_PASSWORD: hr_ai_pass_2026
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: hr-ai
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        envFrom:
          - secretRef:
              name: postgres-secret
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
        volumeMounts:
          - name: postgres-data
            mountPath: /var/lib/postgresql/data
          - name: init-sql
            mountPath: /docker-entrypoint-initdb.d
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "hr_ai_user", "-d", "hr_ai_db"]
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 6
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "hr_ai_user", "-d", "hr_ai_db"]
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init-sql
          configMap:
            name: postgres-init-sql
---
# Headless service for StatefulSet stable DNS
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: hr-ai
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
# ClusterIP service for application connectivity
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: hr-ai
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
