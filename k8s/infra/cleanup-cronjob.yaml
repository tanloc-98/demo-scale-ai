apiVersion: batch/v1
kind: CronJob
metadata:
  name: data-retention-cleanup
  namespace: hr-ai
spec:
  schedule: "0 2 * * *"   # 02:00 hàng ngày
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: cleanup
            image: hr-ai-backend:latest
            imagePullPolicy: Never
            command: ["python", "-m", "backend.governance.data_retention_runner"]
            env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://hr_ai_user:hr_ai_pass_2026@postgres-service:5432/hr_ai_db"
            resources:
              requests:
                cpu: "50m"
                memory: "128Mi"
              limits:
                cpu: "200m"
                memory: "256Mi"
