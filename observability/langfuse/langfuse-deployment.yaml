---
# Langfuse v3 self-hosted — minimal K8s deployment for demo
# Sử dụng PostgreSQL riêng trong namespace observability
apiVersion: v1
kind: ConfigMap
metadata:
  name: langfuse-config
  namespace: observability
data:
  # Langfuse v2 env vars
  NEXTAUTH_URL: "http://localhost:3002"
  NEXTAUTH_SECRET: "langfuse-nextauth-secret-2026"
  SALT: "langfuse-salt-2026"
  DATABASE_URL: "postgresql://langfuse:langfuse_pass@langfuse-postgres:5432/langfuse"
  # Pre-seed org + project (v2 feature)
  LANGFUSE_INIT_ORG_ID: "hr-ai-org"
  LANGFUSE_INIT_ORG_NAME: "HR AI Demo"
  LANGFUSE_INIT_PROJECT_ID: "hr-ai-project"
  LANGFUSE_INIT_PROJECT_NAME: "HR AI Agents"
  LANGFUSE_INIT_PROJECT_PUBLIC_KEY: "lf-pk-hr-ai-demo-2026"
  LANGFUSE_INIT_PROJECT_SECRET_KEY: "lf-sk-hr-ai-demo-2026"
  LANGFUSE_INIT_USER_EMAIL: "admin@hr-ai.local"
  LANGFUSE_INIT_USER_NAME: "admin"
  LANGFUSE_INIT_USER_PASSWORD: "hr-ai-admin-2026"
  TELEMETRY_ENABLED: "false"
  # Required for Docker/K8s — disables hostname validation
  HOSTNAME: "0.0.0.0"
---
# Langfuse PostgreSQL
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-postgres
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-postgres
  template:
    metadata:
      labels:
        app: langfuse-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_USER
          value: langfuse
        - name: POSTGRES_PASSWORD
          value: langfuse_pass
        - name: POSTGRES_DB
          value: langfuse
        ports:
        - containerPort: 5432
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-postgres
  namespace: observability
spec:
  selector:
    app: langfuse-postgres
  ports:
  - port: 5432
    targetPort: 5432
---
# Langfuse Server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse
  template:
    metadata:
      labels:
        app: langfuse
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z langfuse-postgres 5432; do echo waiting for postgres; sleep 2; done']
      containers:
      - name: langfuse
        image: langfuse/langfuse:2
        envFrom:
        - configMapRef:
            name: langfuse-config
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
        readinessProbe:
          httpGet:
            path: /api/public/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-service
  namespace: observability
spec:
  selector:
    app: langfuse
  ports:
  - name: http
    port: 3000
    targetPort: 3000
