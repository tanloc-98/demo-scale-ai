# Loki + Promtail stack for HR AI Agents log aggregation
# helm install loki grafana/loki-stack -n observability -f promtail-config.yaml

loki:
  enabled: true
  persistence:
    enabled: true
    storageClassName: hostpath
    size: 10Gi
  config:
    limits_config:
      retention_period: 2160h    # 90 days default; audit_log stream kept 5 years via ruler
    schema_config:
      configs:
        - from: "2024-01-01"
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h

promtail:
  enabled: true
  config:
    clients:
      - url: http://loki:3100/loki/api/v1/push
    scrape_configs:
      - job_name: hr-ai-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [hr-ai]
        pipeline_stages:
          - json:
              expressions:
                level:      level
                agent:      agent
                employee_id: employee_id
                trace_id:   trace_id
          # Drop raw PII — never store fields that may contain sensitive data
          - drop:
              expression: '.*bank_account.*|.*cccd.*|.*phone.*|.*full_name.*'
          - labels:
              level:
              agent:
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

grafana:
  enabled: true
  adminPassword: hr-ai-grafana-2026
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.hr-ai.local
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Loki
          type: loki
          url: http://loki:3100
          isDefault: false
