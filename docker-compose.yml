version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MOCK_LLM=true
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite+aiosqlite:///./hrdb.sqlite3
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./hrdb.sqlite3:/app/hrdb.sqlite3

  salary-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["celery", "-A", "backend.workers.llm_worker.app", "worker", "-l", "INFO", "-Q", "salary"]
    environment:
      - MOCK_LLM=true
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite+aiosqlite:///./hrdb.sqlite3
    depends_on:
      redis:
        condition: service_healthy

  timesheet-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["celery", "-A", "backend.workers.llm_worker.app", "worker", "-l", "INFO", "-Q", "timesheet"]
    environment:
      - MOCK_LLM=true
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite+aiosqlite:///./hrdb.sqlite3
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
